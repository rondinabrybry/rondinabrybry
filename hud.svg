<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="1" stop-color="#0b0628"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#ff00c8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00f0ff" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="clip"><rect x="0" y="0" width="860" height="230" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="860" height="230" fill="url(#bg)"/>
    <rect width="860" height="230" fill="url(#grid)"/>
    <!-- scanline -->
    <rect x="0" y="-40" width="860" height="40" fill="#00f0ff" opacity="0.06">
      <animate attributeName="y" from="-40" to="230" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="858" height="228" rx="14" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>

  <!-- corner brackets -->
  <g stroke="#00f0ff" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M16 40V16H40"/><path d="M820 16H844V40"/>
    <path d="M16 190V214H40"/><path d="M820 214H844V190"/>
  </g>

  <!-- title bar -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <circle cx="40" cy="36" r="5" fill="#ff5f56"/>
    <circle cx="58" cy="36" r="5" fill="#ffbd2e"/>
    <circle cx="76" cy="36" r="5" fill="#27c93f"/>
    <text x="100" y="41" fill="#7a7aa8" font-size="13">ken@backend.dude:~$ system.status --verbose</text>

    <text x="40" y="80" fill="#00f0ff" font-size="15" filter="url(#glow)">&gt; USER</text>
    <text x="170" y="80" fill="#e0e0ff" font-size="15">Keneth Bryan R. Mancao</text>

    <text x="40" y="108" fill="#00f0ff" font-size="15" filter="url(#glow)">&gt; ROLE</text>
    <text x="170" y="108" fill="#e0e0ff" font-size="15">Full-stack Dev · IT Instructor · Tagapagligtas</text>

    <text x="40" y="136" fill="#00f0ff" font-size="15" filter="url(#glow)">&gt; BASE</text>
    <text x="170" y="136" fill="#e0e0ff" font-size="15">Cebu, Philippines [UTC+08]</text>

    <text x="40" y="164" fill="#00f0ff" font-size="15" filter="url(#glow)">&gt; CORE</text>
    <text x="170" y="164" fill="#e0e0ff" font-size="15">Laravel · Next.js · MySQL · Self-hosted infra</text>

    <text x="40" y="196" fill="#ff00c8" font-size="15" filter="url(#glow)">&gt; STATUS</text>
    <text x="170" y="196" fill="#27c93f" font-size="15">ONLINE · shipping code</text>
    <rect x="365" y="183" width="9" height="16" fill="#27c93f">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- side radar -->
  <g transform="translate(745 125)" fill="none" stroke="#8a2be2" stroke-opacity="0.8">
    <circle r="55"/><circle r="36"/><circle r="17"/>
    <path d="M-55 0H55M0 -55V55" stroke-opacity="0.4"/>
    <path d="M0 0L0 -55A55 55 0 0 1 39 -39Z" fill="#00f0ff" fill-opacity="0.25" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="22" cy="-18" r="3" fill="#ff00c8" stroke="none">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
